<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WOMEN'S 3-ON-3 — CONSOLATION BRACKET</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;background:#0f1117;font-family:'Barlow Condensed',sans-serif;color:#fff;overflow:hidden;}
.wrapper{width:100%;height:100%;display:flex;flex-direction:column;padding:28px 40px;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.header-left{display:flex;align-items:center;gap:16px;}
.header img{height:48px;opacity:0.9;}
.header-title{font-size:26px;font-weight:900;letter-spacing:3px;}
.header-sub{font-size:14px;color:#8890aa;letter-spacing:2px;text-transform:uppercase;font-family:'Barlow',sans-serif;}
.bracket-container{flex:1;display:flex;align-items:stretch;gap:0;position:relative;}
.round{display:flex;flex-direction:column;justify-content:space-around;min-width:260px;gap:0;position:relative;z-index:2;}
.round-label{font-size:11px;color:#8890aa;letter-spacing:2px;text-transform:uppercase;font-family:'Barlow',sans-serif;text-align:center;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #2e3350;}
.bout{background:#3d455e;border:1px solid #2e3350;border-radius:8px;padding:0;overflow:hidden;margin:6px 0;transition:border-color 0.3s;min-width:240px;}
.bout.complete{border-color:#27ae60;}
.bout-header{font-size:9px;color:#8890aa;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px 4px;font-family:'Barlow',sans-serif;background:#16182a;}
.bout-team{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid #22263a;}
.bout-team.winner{background:rgba(39,174,96,0.1);}
.bout-team-name{font-size:16px;font-weight:700;color:#ccc;}
.bout-team-name.winner{color:#fff;font-weight:900;}
.bout-team-name.tbd{color:#555;font-style:italic;font-weight:400;}
.bout-team-score{font-size:18px;font-weight:900;color:#fff;min-width:24px;text-align:right;}
.result-tag{font-size:9px;color:#27ae60;letter-spacing:1px;padding:4px 12px;text-transform:uppercase;font-family:'Barlow',sans-serif;border-top:1px solid #22263a;}
.champion-box{background:linear-gradient(135deg,#1a2a4a,#2c3e6b);border:2px solid #3d5af1;border-radius:12px;padding:20px 28px;text-align:center;margin:auto 0;}
.champion-trophy{font-size:32px;margin-bottom:6px;}
.champion-label{font-size:11px;color:#8890aa;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.champion-name{font-size:24px;font-weight:900;}
.place-box{background:#1a1d27;border:1px solid #2e3350;border-radius:8px;padding:14px 20px;text-align:center;margin:auto 0;}
.place-label{font-size:10px;color:#8890aa;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;}
.place-name{font-size:18px;font-weight:700;color:#ccc;}
.conn{position:relative;min-width:40px;display:flex;flex-direction:column;justify-content:space-around;}
/* Supermatches layout */
.super-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:40px;align-content:center;align-items:start;}
.super-card{background:#1a1d27;border:1px solid #2e3350;border-radius:12px;overflow:hidden;}
.super-card.complete{border-color:#27ae60;}
.super-title{font-size:11px;color:#8890aa;letter-spacing:2px;text-transform:uppercase;padding:12px 16px 8px;background:#16182a;font-family:'Barlow',sans-serif;}
.super-team{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-top:1px solid #22263a;}
.super-team.winner{background:rgba(39,174,96,0.1);}
.super-team-name{font-size:22px;font-weight:700;color:#ccc;}
.super-team-name.winner{color:#fff;font-weight:900;}
.super-team-name.tbd{color:#555;font-style:italic;font-weight:400;}
.super-team-score{font-size:28px;font-weight:900;color:#fff;}
.super-result{font-size:10px;color:#27ae60;letter-spacing:1px;padding:8px 16px;text-transform:uppercase;font-family:'Barlow',sans-serif;border-top:1px solid #22263a;}
/* Compact cards for big brackets / round robins */
.dense .bout{margin:3px 0;}
.dense .bout-header{padding:3px 10px 2px;}
.dense .bout-team{padding:4px 10px;}
.dense .bout-team-name{font-size:14px;}
.dense .bout-team-score{font-size:15px;}
.dense .result-tag{display:none;}
.dense .round{min-width:0;}
.empty-note{margin:auto;font-size:22px;color:#8890aa;letter-spacing:2px;text-transform:uppercase;font-family:'Barlow',sans-serif;}
/* Round labels pinned to the top of each column so they line up whatever the bout count */
.round{padding-top:34px;}
.round > .round-label{position:absolute;top:0;left:0;right:0;}
/* Round robin views (used automatically when the division is a round robin) */
.rr-wrap{flex:1;display:flex;gap:40px;align-items:flex-start;min-height:0;}
.rr-table{flex:1;border-collapse:separate;border-spacing:0 8px;font-family:'Barlow Condensed',sans-serif;}
.rr-table th{font-size:13px;color:#8890aa;letter-spacing:2px;text-transform:uppercase;font-family:'Barlow',sans-serif;font-weight:600;text-align:center;padding:0 14px 4px;}
.rr-table th.l,.rr-table td.l{text-align:left;}
.rr-table td{background:#3d455e;padding:14px;text-align:center;font-size:30px;font-weight:700;color:#ddd;border-top:1px solid #2e3350;border-bottom:1px solid #2e3350;}
.rr-table td:first-child{border-left:1px solid #2e3350;border-radius:8px 0 0 8px;width:80px;color:#8890aa;}
.rr-table td:last-child{border-right:1px solid #2e3350;border-radius:0 8px 8px 0;}
.rr-table td.team{font-size:34px;font-weight:900;color:#fff;}
.rr-table tr.lead td{background:linear-gradient(90deg,#1a2a4a,#2c3e6b);border-color:#3d5af1;}
.rr-side{width:420px;display:flex;flex-direction:column;gap:20px;}
.rr-progress{background:#1a1d27;border:1px solid #2e3350;border-radius:8px;padding:16px 20px;font-size:18px;color:#ccc;letter-spacing:1px;}
.rr-progress b{color:#fff;font-size:26px;}
.rr-note{font-size:13px;color:#8890aa;font-family:'Barlow',sans-serif;line-height:1.5;}
.rr-grid{flex:1;display:flex;gap:18px;align-items:stretch;min-height:0;}
.rr-grid .round{flex:1;min-width:0;justify-content:flex-start;}
.rr-grid .bout{min-width:0;}
.rr-grid .bout-team-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;}
.rr-bye{font-size:11px;color:#8890aa;text-align:center;font-family:'Barlow',sans-serif;letter-spacing:1px;text-transform:uppercase;margin-top:6px;}
/* Line bracket (TrackWrestling style): one line per team, connectors per bout */
.bracket-container.lines{display:block;position:relative;}
.br-svg{position:absolute;left:0;top:0;overflow:visible;}
.br-line{stroke:#3d455e;stroke-width:3;stroke-linecap:round;}
.br-line.lose{stroke:#2e3350;}
.br-line.win{stroke:#27ae60;stroke-width:4;}
.br-line.win.out{stroke:#f5c542;stroke-width:5;}
.br-line.fresh{stroke-dasharray:1200;stroke-dashoffset:1200;animation:brDraw 1.4s ease-out forwards;}
@keyframes brDraw{to{stroke-dashoffset:0;}}
.br-col{position:absolute;top:0;font-size:12px;color:#8890aa;letter-spacing:2px;text-transform:uppercase;font-family:'Barlow',sans-serif;text-align:center;border-bottom:1px solid #2e3350;padding-bottom:6px;}
.br-name{position:absolute;white-space:nowrap;overflow:hidden;font-weight:700;color:#dfe3ee;line-height:1.2;display:flex;align-items:center;gap:7px;}
.br-name i{display:inline-block;width:.45em;height:.9em;border-radius:2px;flex:none;}
.br-name em{font-style:normal;font-size:.62em;color:#8890aa;font-weight:600;border:1px solid #3d455e;border-radius:4px;padding:0 .35em;flex:none;}
.br-name.win{color:#fff;font-weight:900;}
.br-name.lose{color:#6b7390;font-weight:600;}
.br-name.champ{color:#f5c542;}
.br-name .ph{color:#6b7390;font-style:italic;font-weight:400;font-size:.8em;}
.br-name .from{color:#6b7390;font-size:.55em;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-left:4px;}
.br-name.fresh{animation:brIn 1s ease-out 0.6s both;}
@keyframes brIn{from{opacity:0;transform:translateX(-24px);}to{opacity:1;transform:none;}}
.br-score{position:absolute;width:34px;text-align:right;font-weight:900;color:#aab1c5;line-height:1.2;}
.br-score.win{color:#27ae60;}
.br-bout,.br-place,.br-bye{position:absolute;color:#8890aa;font-family:'Barlow',sans-serif;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
.br-place{color:#f5c542;}
.br-bye{color:#5a6280;}
.super-dense{gap:18px;align-content:center;}
.super-dense .super-title{padding:8px 12px 5px;}
.super-dense .super-team{padding:8px 12px;}
.super-dense .super-athlete-name,.super-dense .super-team-name{font-size:18px;}
.super-dense .super-team-score{font-size:20px;}
.super-dense .super-result{padding:5px 12px;}
.super-xdense{gap:12px;}
.super-xdense .super-athlete-name,.super-xdense .super-team-name{font-size:15px;}
.super-xdense .super-result{display:none;}
.br-name b{font-weight:inherit;}
</style>
</head>

<script>/* ── cjl_rr.js (inlined copy: edit cjl_rr.js, then run tests/inline-rr.js) ── */
/* CJL round robin helpers for the display pages.
 * The standings logic mirrors computeRoundRobinStandings() in the Apps Script
 * exactly, so the overlays, the public status page and the Sheet always agree:
 *   dual wins → head-to-head wins among the tied teams → team points scored
 *   → team-point difference → name.
 * Works on the flat bout list the control panel pushes on the relay's
 * 'bracket' channel (same shape as ?action=getBracket).
 */
(function (root) {
  'use strict';
  var RR_PREFIX = 'Round Robin — Round ';
  var FINAL_PREFIX = 'Round Robin Final';

  function str(v) { return v === null || v === undefined ? '' : String(v).trim(); }
  function isPlaceholder(t) { var s = str(t); return !s || s === 'TBD' || /^(?:[WL]|RR)-/.test(s); }
  function isRRNote(n) { return str(n).indexOf(RR_PREFIX) === 0; }
  function isFinalNote(n) { return str(n).indexOf(FINAL_PREFIX) === 0; }
  function divBouts(bouts, division) { return (bouts || []).filter(function (b) { return str(b.division) === division; }); }

  function isRoundRobin(bouts, division) {
    return divBouts(bouts, division).some(function (b) { return isRRNote(b.notes); });
  }

  function standings(bouts, division) {
    var duals = divBouts(bouts, division);
    var rr = duals.filter(function (d) { return isRRNote(d.notes); });
    var teams = {};
    function add(name) {
      if (isPlaceholder(name)) return;
      if (!teams[name]) teams[name] = { name: name, wins: 0, losses: 0, played: 0, ptsFor: 0, ptsAgainst: 0 };
    }
    rr.forEach(function (d) { add(str(d.team1)); add(str(d.team2)); });
    var done = rr.filter(function (d) {
      return d.status === 'Complete' && !isPlaceholder(d.team1) && !isPlaceholder(d.team2) &&
        (str(d.winner) === str(d.team1) || str(d.winner) === str(d.team2));
    });
    done.forEach(function (d) {
      var t1 = teams[str(d.team1)], t2 = teams[str(d.team2)];
      var s1 = Number(d.team1Score) || 0, s2 = Number(d.team2Score) || 0;
      t1.played++; t2.played++;
      t1.ptsFor += s1; t1.ptsAgainst += s2;
      t2.ptsFor += s2; t2.ptsAgainst += s1;
      if (str(d.winner) === str(d.team1)) { t1.wins++; t2.losses++; } else { t2.wins++; t1.losses++; }
    });
    var list = Object.keys(teams).map(function (k) { return teams[k]; });
    list.forEach(function (t) { t.diff = t.ptsFor - t.ptsAgainst; });
    list.sort(function (a, b) { return b.wins - a.wins; });
    var ordered = [], i = 0;
    while (i < list.length) {
      var j = i;
      while (j < list.length && list[j].wins === list[i].wins) j++;
      var group = list.slice(i, j), names = {};

  }
  const activeRounds = derived.length ? derived : ROUNDS;
  // Big brackets (16 teams → 8 bouts in round 1): compact cards so they fit 1080p.
  container.classList.toggle('dense', Math.max.apply(null, activeRounds.map(r => r.bouts.length)) > 4);

  activeRounds.forEach((round, ri) => {
    if (ri > 0) {
      const conn = document.createElement('div');
      conn.className = 'conn';
      conn.style.minWidth = '50px';
      container.appendChild(conn);
    }
    const col = document.createElement('div');
    col.className = 'round';
    col.style.flex = '1';
    const label = document.createElement('div');
    label.className = 'round-label';
    label.textContent = round.label;
    col.appendChild(label);
    round.bouts.forEach(boutName => {
      const bout = allBouts.find(b => b.bout === boutName);
      col.appendChild(makeBoutCard(bout, boutName));
    });
    container.appendChild(col);
  });

  // Final placement box
  const finalRound = activeRounds[activeRounds.length - 1];
  const finalBout = allBouts.find(b => b.bout === finalRound.bouts[0]);
  if (finalBout && finalBout.winner) {
    const conn = document.createElement('div');
    conn.className = 'conn';
    conn.style.minWidth = '50px';
    container.appendChild(conn);
    const placeCol = document.createElement('div');
    placeCol.className = 'round';
    placeCol.style.flex = '0.6';
    placeCol.style.justifyContent = 'center';
    if (IS_CHAMP) {
      placeCol.innerHTML = `<div class="champion-box"><div class="champion-trophy">🏆</div><div class="champion-label">Champion</div><div class="champion-name">${finalBout.winner}</div></div>`;
    } else {
      placeCol.innerHTML = `<div class="place-box"><div class="place-label">${PLACE_LABEL}</div><div class="place-name">${finalBout.winner} wins</div></div>`;
    }
    container.appendChild(placeCol);
  }
}

function renderSupermatches(container) {
  // Only supermatches that have been fought, in bout order.
  const done = allBouts.filter(b => b.division === 'Supermatch' && b.status === 'Complete')
    .sort((a, b) => (parseInt(String(a.bout).replace(/\D/g, ''), 10) || 0) - (parseInt(String(b.bout).replace(/\D/g, ''), 10) || 0));
  if (!done.length) {
    container.className = 'bracket-container';
    container.innerHTML = '<div class="empty-note">No supermatches yet — results appear here as they finish.</div>';
    return;
  }
  const n = done.length, cols = n <= 3 ? n : n <= 8 ? 4 : n <= 15 ? 5 : 6;
  container.className = 'super-grid' + (n > 8 ? ' super-dense' : '') + (n > 15 ? ' super-xdense' : '');
  container.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
  done.forEach(b => container.appendChild(makeSuperCard(b, b.bout)));
}

function makeSuperCard(bout, boutName) {
  const card = document.createElement('div');
  card.className = 'super-card' + (bout && bout.status==='Complete' ? ' complete' : '');
  const t1 = bout ? bout.team1 : 'TBD';
  const t2 = bout ? bout.team2 : 'TBD';
  const s1 = bout && bout.team1Score ? bout.team1Score : '';
  const s2 = bout && bout.team2Score ? bout.team2Score : '';
  const w  = bout ? bout.winner : '';
  const tbd1 = !t1 || t1==='TBD' || t1.startsWith('W-') || t1.startsWith('L-') || t1.startsWith('RR-');
  const tbd2 = !t2 || t2==='TBD' || t2.startsWith('W-') || t2.startsWith('L-') || t2.startsWith('RR-');
  card.innerHTML = `
    <div class="super-title">${boutName}</div>
    <div class="super-team${w===t1?' winner':''}">
      <span class="super-team-name${w===t1?' winner':''}${tbd1?' tbd':''}">${t1||'TBD'}</span>
      <span class="super-team-score">${s1}</span>
    </div>
    <div class="super-team${w===t2?' winner':''}">
      <span class="super-team-name${w===t2?' winner':''}${tbd2?' tbd':''}">${t2||'TBD'}</span>
      <span class="super-team-score">${s2}</span>
    </div>
    ${bout && bout.status==='Complete' ? `<div class="super-result">✓ ${w} wins</div>` : ''}
  `;
  return card;
}

// Brackets show full team names (short names are only for the mat overlays).
function shortIfLong(t) { return t; }

function phLabel(t) { return window.CJLRR ? CJLRR.placeholderLabel(t) : (t || 'TBD'); }

function makeBoutCard(bout, boutName) {
  const card = document.createElement('div');
  card.className = 'bout' + (bout && bout.status==='Complete' ? ' complete' : '');
  const t1 = bout ? bout.team1 : 'TBD';
  const t2 = bout ? bout.team2 : 'TBD';
  const s1 = bout && bout.team1Score ? bout.team1Score : '';
  const s2 = bout && bout.team2Score ? bout.team2Score : '';
  const w  = bout ? bout.winner : '';
  const tbd1 = !t1 || t1==='TBD' || t1.startsWith('W-') || t1.startsWith('L-') || t1.startsWith('RR-');
  const tbd2 = !t2 || t2==='TBD' || t2.startsWith('W-') || t2.startsWith('L-') || t2.startsWith('RR-');
  card.innerHTML = `
    <div class="bout-header">${boutName}</div>
    <div class="bout-team${w===t1?' winner':''}">
      <span class="bout-team-name${w===t1?' winner':''}${tbd1?' tbd':''}">${tbd1 ? phLabel(t1) : shortIfLong(t1, bout && bout.team1Short)}</span>
      <span class="bout-team-score">${s1}</span>
    </div>
    <div class="bout-team${w===t2?' winner':''}">
      <span class="bout-team-name${w===t2?' winner':''}${tbd2?' tbd':''}">${tbd2 ? phLabel(t2) : shortIfLong(t2, bout && bout.team2Short)}</span>
      <span class="bout-team-score">${s2}</span>
    </div>
    ${bout && bout.status==='Complete' ? `<div class="result-tag">✓ ${shortIfLong(w, w===t1 ? bout.team1Short : bout.team2Short)} wins${bout.resultType==='Tiebreaker' ? ' on tiebreaker' : ''}</div>` : ''}
  `;
  return card;
}

// ── Round robin ─────────────────────────────────────────────────────────────
// When this division is set up as a round robin in the Sheet, this page shows
// RR_VIEW instead of a bracket: 'standings' (championship pages) or 'results'
// (consolation pages). Nothing to change in OBS.
function renderRoundRobin(container) {
  const R = window.CJLRR, esc = R.esc;
  container.classList.remove('lines');
  const base = TITLE.split(' — ')[0];
  container.innerHTML = '';
  container.style.display = 'flex';
  container.style.alignItems = 'stretch';
  const rounds = R.rounds(allBouts, DIVISION);
  container.classList.toggle('dense', rounds.some(r => r.bouts.length > 4) || rounds.length > 7);
  const fin = R.finalBout(allBouts, DIVISION);
  const rrBouts = rounds.filter(r => r.label !== 'Final').reduce((a, r) => a.concat(r.bouts), []);
  const played = rrBouts.filter(b => b.status === 'Complete').length;

  if (RR_VIEW === 'standings') {
    document.getElementById('title').textContent = base + ' — STANDINGS';
    const table = R.standings(allBouts, DIVISION);
    const champ = R.champion(allBouts, DIVISION);
    const rows = table.map((t, i) => `<tr class="${i === 0 && t.wins > 0 ? 'lead' : ''}">
        <td>${t.rank}</td><td class="l team">${esc(t.name)}</td><td>${t.wins}</td><td>${t.losses}</td>
        <td>${t.ptsFor}</td><td>${t.diff > 0 ? '+' : ''}${t.diff}</td></tr>`).join('');
    let side = '';
    if (champ) {
      side += `<div class="champion-box"><div class="champion-trophy">🏆</div><div class="champion-label">Champion</div><div class="champion-name">${esc(champ)}</div></div>`;
    } else if (fin) {
      side += `<div class="round-label" style="margin-bottom:0">Final</div>`;
      side += makeBoutCard(fin, fin.bout).outerHTML;
    }
    side += `<div class="rr-progress"><b>${played}</b> / ${rrBouts.length} round robin bouts complete</div>`;
    side += `<div class="rr-note">Ranked by dual wins, then head-to-head, then team points scored, then team-point difference.${fin ? ' Top two meet in the final.' : ''}</div>`;
    container.innerHTML = `<div class="rr-wrap"><table class="rr-table"><thead><tr><th>#</th><th class="l">Team</th><th>W</th><th>L</th><th>Team Pts</th><th>Diff</th></tr></thead><tbody>${rows}</tbody></table><div class="rr-side">${side}</div></div>`;
    return;
  }

  document.getElementById('title').textContent = base + ' — ROUND ROBIN RESULTS';
  const grid = document.createElement('div');
  grid.className = 'rr-grid';
  rounds.forEach(r => {
    const col = document.createElement('div');
    col.className = 'round';
    const label = document.createElement('div');
    label.className = 'round-label';
    label.textContent = r.label;
    col.appendChild(label);
    r.bouts.forEach(b => col.appendChild(makeBoutCard(b, b.bout)));
    grid.appendChild(col);
  });
  container.appendChild(grid);
}

loadBracket();
connectBracketWS();
